### MONITORS ###
################


# See https://wiki.hypr.land/Configuring/Monitors/
#monitor=,preferred,auto,auto

monitorv2 {
  output = HDMI-A-6
  mode = 3840x2160@60
  position = 0x-2160
  scale = 1
  transform = 2
}
monitorv2 {
  output = DP-5
  mode = 3840x2160@60
  position = 0x0
  scale = 1
 }